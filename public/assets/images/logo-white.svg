<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 75" width="100%" height="100%">
  <!-- Stylized Geometric A with Diamond -->
  <g fill="#FFFFFF">
    <!-- Left leg -->
    <polygon points="12,42 22,42 16,10" />
    <polygon points="4,42 14,42 20,24 14,24" />
    <!-- Center Diamond in A -->
    <polygon points="17,10 23,22 17,34 11,22" />
    <!-- Right leg -->
    <polygon points="18,10 24,42 34,42" />
    <!-- Inner right strut -->
    <polygon points="20,24 26,24 32,42 22,42" />
  </g>

  <!-- KASHCOKE Bold Letters -->
  <text x="38" y="38" font-family="'Outfit', 'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="1">KASHCOKE</text>
  
  <!-- Top Horizontal Line -->
  <line x1="2" y1="46" x2="310" y2="46" stroke="#94A3B8" stroke-width="2" />
  
  <!-- Subtitle: INDUSTRIES PVT LTD -->
  <text x="5" y="60" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#E2E8F0" letter-spacing="6">INDUSTRIES PVT LTD</text>
  
  <!-- Bottom Horizontal Line -->
  <line x1="2" y1="67" x2="310" y2="67" stroke="#94A3B8" stroke-width="2" />
</svg>
